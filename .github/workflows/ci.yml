name: TaskManagement CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: TaskManagement.API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore TaskManagement.API.slnx

      - name: Build solution
        run: dotnet build TaskManagement.API.slnx --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test TaskManagement.API.slnx --configuration Release --no-build --no-restore

  docker-build:
    name: Validate Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./TaskManagement.API
          file: ./TaskManagement.API/Dockerfile
          push: false
          tags: taskmanagement-api:ci
